[project]
name = "reppilot-api"
version = "0.1.0"
description = "RepPilot backend: accounts, cloud sync, moderated community, messages and challenges."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reppilot_api", "reppilot_api.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
